<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>엔트로피 · 과제 관리</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f4f7f5;
      --surface: #ffffff;
      --surface-soft: #f7faf8;
      --ink: #1f2a24;
      --muted: #68756d;
      --line: #dce6df;
      --primary: #20704b;
      --primary-dark: #155436;
      --primary-soft: #e6f3eb;
      --warning: #9a5a08;
      --warning-soft: #fff4dc;
      --danger: #b42318;
      --shadow: 0 18px 44px rgba(31, 61, 45, .08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: "Segoe UI", "Noto Sans KR", system-ui, sans-serif;
      line-height: 1.55;
      word-break: keep-all;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    a { color: var(--primary); }

    .app-shell { min-height: 100vh; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 72px;
      padding: 16px max(24px, calc((100vw - 1120px) / 2));
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      color: #fff;
      background: var(--primary);
      border-radius: 12px;
      font-size: 20px;
    }
    .brand strong { display: block; font-size: 15px; letter-spacing: -.02em; }
    .brand span { display: block; color: var(--muted); font-size: 12px; }
    .account-bar { display: flex; align-items: center; gap: 12px; }
    .account-name { color: var(--muted); font-size: 14px; }

    main { width: min(1120px, calc(100% - 48px)); margin: 0 auto; padding: 48px 0 72px; }
    .login-wrap { display: grid; min-height: calc(100vh - 72px); place-items: center; padding: 24px 0 72px; }
    .login-card { width: min(440px, 100%); padding: 36px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); }
    .login-card h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: -.04em; }
    .eyebrow { margin: 0 0 10px; color: var(--primary); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .intro { margin: 0 0 28px; color: var(--muted); }
    .demo-note { margin-top: 20px; padding: 12px 14px; color: #496056; background: var(--surface-soft); border: 1px solid var(--line); border-radius: 12px; font-size: 13px; }

    .page-heading { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 30px; }
    .page-heading h1 { margin: 0; font-size: clamp(28px, 4vw, 42px); letter-spacing: -.055em; line-height: 1.18; }
    .page-heading p { max-width: 600px; margin: 10px 0 0; color: var(--muted); }
    .heading-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 9px 16px;
      color: #fff;
      background: var(--primary);
      border: 1px solid var(--primary);
      border-radius: 10px;
      font-weight: 700;
      transition: background .15s ease, border-color .15s ease, transform .15s ease;
    }
    .button:hover { background: var(--primary-dark); border-color: var(--primary-dark); transform: translateY(-1px); }
    .button.secondary { color: var(--primary-dark); background: var(--surface); border-color: var(--line); }
    .button.secondary:hover { background: var(--primary-soft); border-color: #a9ceb7; }
    .button.full { width: 100%; }

    .panel { margin-bottom: 28px; padding: 26px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 8px 24px rgba(31, 61, 45, .04); }
    .panel-header { display: flex; align-items: start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .panel-header h2 { margin: 0; font-size: 20px; letter-spacing: -.03em; }
    .panel-header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .form-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(180px, .6fr); gap: 0 18px; }
    .field { margin-bottom: 18px; }
    .field.wide { grid-column: 1 / -1; }
    label { display: block; margin-bottom: 7px; font-size: 14px; font-weight: 700; }
    input, textarea, select {
      width: 100%;
      padding: 11px 12px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid #cbd8cf;
      border-radius: 10px;
      outline: none;
    }
    textarea { min-height: 108px; resize: vertical; }
    input:focus, textarea:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(32, 112, 75, .12); }
    .help { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
    .form-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .form-message { min-height: 22px; color: var(--danger); font-size: 13px; }
    .form-message.success { color: var(--primary-dark); }

    .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 0 0 14px; }
    .section-heading h2 { margin: 0; font-size: 20px; letter-spacing: -.03em; }
    .count-label { color: var(--muted); font-size: 13px; }
    .assignment-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px; }
    .assignment-card { padding: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
    .assignment-card h3 { margin: 0; font-size: 19px; letter-spacing: -.03em; }
    .assignment-description { min-height: 49px; margin: 9px 0 18px; color: var(--muted); font-size: 14px; white-space: pre-line; }
    .assignment-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .meta-chip { display: inline-flex; align-items: center; gap: 5px; padding: 6px 9px; color: #476056; background: var(--surface-soft); border-radius: 8px; font-size: 12px; }
    .meta-chip strong { color: var(--ink); font-size: 14px; }
    .due-date { display: flex; align-items: center; gap: 7px; padding-top: 14px; color: var(--muted); border-top: 1px solid var(--line); font-size: 13px; }
    .assignment-card-actions { display: flex; justify-content: flex-end; margin-top: 16px; }
    .submission-list { display: grid; gap: 16px; }
    .submission-card { padding: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
    .submission-card-header { display: flex; align-items: start; justify-content: space-between; gap: 14px; }
    .submission-card h3 { margin: 0; font-size: 18px; letter-spacing: -.03em; }
    .submission-time { color: var(--muted); font-size: 12px; }
    .submission-content { margin: 18px 0; padding: 16px; background: var(--surface-soft); border-radius: 12px; white-space: pre-wrap; }
    .feedback-saved { margin-top: 18px; padding: 16px; color: var(--primary-dark); background: var(--primary-soft); border-radius: 12px; }
    .feedback-saved strong { display: block; margin-bottom: 6px; }
    .feedback-saved p { margin: 0; white-space: pre-wrap; }
    .status-pill { display: inline-flex; padding: 5px 9px; border-radius: 999px; color: var(--warning); background: var(--warning-soft); font-size: 12px; font-weight: 700; white-space: nowrap; }
    .status-pill.done { color: var(--primary-dark); background: var(--primary-soft); }
    .student-assignment-list { display: grid; gap: 14px; }
    .student-assignment-card { display: flex; align-items: center; justify-content: space-between; gap: 22px; padding: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
    .student-assignment-card h3 { margin: 0; font-size: 19px; letter-spacing: -.03em; }
    .student-assignment-card .assignment-description { min-height: 0; margin-bottom: 12px; }
    .student-assignment-card .due-date { padding-top: 0; border-top: 0; }
    .student-assignment-actions { display: flex; flex-shrink: 0; flex-direction: column; align-items: flex-end; gap: 10px; }
    .student-status { display: inline-flex; padding: 5px 9px; color: var(--primary-dark); background: var(--primary-soft); border-radius: 999px; font-size: 12px; font-weight: 700; }
    .student-status.pending { color: var(--warning); background: var(--warning-soft); }
    .student-status.closed { color: var(--muted); background: #eef1ef; }
    .student-status.feedback { color: var(--primary-dark); background: var(--primary-soft); }
    .student-detail { max-width: 760px; margin: 0 auto; }
    .student-detail .assignment-description { min-height: 0; margin: 12px 0 18px; }
    .student-detail-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
    .submission-preview { margin-top: 22px; padding: 18px; background: var(--surface-soft); border: 1px solid var(--line); border-radius: 12px; }
    .submission-preview h3 { margin: 0 0 8px; font-size: 15px; }
    .submission-body { margin: 0; white-space: pre-wrap; }
    .submission-time { margin: 10px 0 0; color: var(--muted); font-size: 12px; }
    .student-feedback { margin-top: 14px; padding: 16px; background: var(--primary-soft); border-radius: 12px; }
    .student-feedback h3 { margin: 0 0 8px; color: var(--primary-dark); font-size: 15px; }
    .student-feedback p { margin: 0; white-space: pre-wrap; }
    .student-feedback .submission-time { margin-top: 10px; color: #4e6e5c; }
    .student-feedback.pending { background: var(--surface-soft); }
    .student-feedback.pending h3 { color: var(--ink); }
    .student-feedback.pending p { color: var(--muted); }
    .empty-state { padding: 42px 20px; color: var(--muted); background: var(--surface); border: 1px dashed #b9c9be; border-radius: 16px; text-align: center; }
    .empty-state strong { display: block; margin-bottom: 5px; color: var(--ink); }

    .hidden { display: none !important; }
    @media (max-width: 700px) {
      .topbar { padding: 13px 18px; }
      .account-name { display: none; }
      main { width: min(100% - 32px, 1120px); padding-top: 32px; }
      .page-heading { display: block; }
      .heading-actions { justify-content: flex-start; margin-top: 20px; }
      .form-grid { display: block; }
      .login-card { padding: 28px 22px; }
      .panel { padding: 20px; }
      .student-assignment-card { display: block; }
      .student-assignment-actions { align-items: flex-start; margin-top: 18px; }
    }

    /* Lovable-inspired visual layer: warm cream, editorial type, quiet borders. */

<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">∑</div>
        <div>
          <strong>엔트로피 피드백</strong>
          <span>챕터 3 · 과제 관리</span>
        </div>
      </div>
      <div id="account-bar" class="account-bar hidden"></div>
    </header>
    <main id="app" aria-live="polite"></main>
  </div>

  <script>
    'use strict';

    const STORAGE_KEYS = {
      session: 'feedback-site-session-v1',
      adminUnlocked: 'feedback-site-admin-unlocked-v1'
    };
    const SUPABASE_URL = 'https://mehurfdcdwuwnpexqspc.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_mA0QPDxClZyGQCXNOD6TLg_RIteQ9eZ';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const ADMIN_PASSWORD = 'teacher-demo';

    const app = document.getElementById('app');
    const accountBar = document.getElementById('account-bar');
    const state = { openPanel: null, studentAssignmentId: null, teacherAssignmentId: null };
    const appData = { users: [], assignments: [], submissions: [] };

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (character) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[character]));
    }

    function formatDueDate(value) {
      if (!value) return '마감일 없음';
      const date = new Date(value + 'T00:00:00');
      if (Number.isNaN(date.getTime())) return value;
      return new Intl.DateTimeFormat('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' }).format(date);
    }

    function todayValue() {
      const date = new Date();
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return year + '-' + month + '-' + day;
    }

    function userFromRow(row) {
      return {
        id: row.id,
        username: row.username,
        password: row.password,
        role: row.role,
        displayName: row.display_name
      };
    }

    function assignmentFromRow(row) {
      return {
        id: row.id,
        title: row.title,
        description: row.description,
        dueDate: row.due_date,
        createdAt: row.created_at
      };
    }

    function submissionFromRow(row) {
      const student = appData.users.find((user) => user.id === row.student_id);
      return {
        id: row.id,
        assignmentId: row.assignment_id,
        studentId: row.student_id,
        studentName: student?.displayName || '이름 없는 학생',
        body: row.content,
        submittedAt: row.first_submitted_at,
        updatedAt: row.last_modified_at,
        feedback: row.feedback,
        feedbackAt: row.feedback_at
      };
    }

    function replaceCachedSubmission(submission) {
      const index = appData.submissions.findIndex((item) => item.id === submission.id);
      if (index === -1) {
        appData.submissions.push(submission);
      } else {
        appData.submissions[index] = submission;
      }
    }

    function errorMessage(error, fallback) {
      console.error(error);
      return error?.message ? `${fallback}: ${error.message}` : fallback;
    }

    async function loadData() {
      const [usersResult, assignmentsResult, submissionsResult] = await Promise.all([
        supabaseClient.from('users').select('*'),
        supabaseClient.from('assignments').select('*'),
        supabaseClient.from('submissions').select('*')
      ]);
      if (usersResult.error) throw usersResult.error;
      if (assignmentsResult.error) throw assignmentsResult.error;
      if (submissionsResult.error) throw submissionsResult.error;

      appData.users = (usersResult.data || []).map(userFromRow);
      appData.assignments = (assignmentsResult.data || []).map(assignmentFromRow);
      appData.submissions = (submissionsResult.data || []).map(submissionFromRow);
    }

    async function ensureAccounts() {
      const accounts = [
        {
          username: 'teacher',
          password: 'teacher-demo',
          role: 'teacher',
          displayName: '엔트로피 수업 선생님'
        },
        {
          username: 'student',
          password: 'student-demo',
          role: 'student',
          displayName: '엔트로피 수업 학생'
        }
      ];
      for (const account of accounts) {
        if (appData.users.some((user) => user.role === account.role)) continue;
        const { data: row, error } = await supabaseClient
          .from('users')
          .insert({
            username: account.username,
            password: account.password,
            role: account.role,
            display_name: account.displayName
          })
          .select('*')
          .single();
        if (error) throw error;
        appData.users.push(userFromRow(row));
      }
      return appData.users;
    }

    function currentUser() {
      const sessionId = sessionStorage.getItem(STORAGE_KEYS.session);
      return appData.users.find((user) => user.id === sessionId) || null;
    }

    function getAssignments() {
      return appData.assignments.slice().sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    }

    function getSubmissions() {
      return appData.submissions.slice();
    }

    async function saveAssignment(title, description, dueDate, sourceId) {
      const source = sourceId ? getAssignments().find((assignment) => assignment.id === sourceId) : null;
      const { data: row, error } = await supabaseClient
        .from('assignments')
        .insert({
          title: source ? source.title : title,
          description: source ? source.description : description,
          due_date: dueDate
        })
        .select('*')
        .single();
      if (error) throw error;
      appData.assignments.push(assignmentFromRow(row));
    }

    function assignmentStats(assignmentId) {
      const submissions = getSubmissions().filter((submission) => submission.assignmentId === assignmentId);
      const studentIds = new Set(submissions.map((submission) => submission.studentId || submission.studentName || submission.id));
      return {
        submitted: studentIds.size,
        waiting: submissions.filter((submission) => !submission.feedbackAt).length
      };
    }

    function setAccountBar(user) {
      if (!user) {
        accountBar.classList.add('hidden');
        accountBar.innerHTML = '';
        return;
      }
      accountBar.classList.remove('hidden');
      accountBar.innerHTML = `<span class="account-name">${escapeHtml(user.displayName)}</span><button type="button" class="button secondary" id="logout-button">로그아웃</button>`;
      document.getElementById('logout-button').addEventListener('click', () => {
        sessionStorage.removeItem(STORAGE_KEYS.session);
        sessionStorage.removeItem(STORAGE_KEYS.adminUnlocked);
        state.openPanel = null;
        state.studentAssignmentId = null;
        state.teacherAssignmentId = null;
        render();
      });
    }

    function renderLoading() {
      accountBar.classList.add('hidden');
      app.innerHTML = `
        <section class="login-wrap" aria-live="polite">
          <div class="login-card">
            <p class="eyebrow">Entropy feedback</p>
            <h1>불러오는 중</h1>
            <p class="intro">Supabase에서 과제와 제출 정보를 확인하고 있어요.</p>
          </div>
        </section>`;

            <p class="eyebrow">Entropy feedback</p>
            <h1 id="load-error-title">데이터를 불러오지 못했어요</h1>
            <p class="intro">Supabase 연결 또는 테이블 권한을 확인한 뒤 페이지를 새로고침해 주세요.</p>
            <p class="form-message">${escapeHtml(errorMessage(error, '연결 오류'))}</p>
          </div>
        </section>`;
    }

    function render() {
      const user = currentUser();
      setAccountBar(user);
      if (user?.role === 'teacher') {
        if (sessionStorage.getItem(STORAGE_KEYS.adminUnlocked) === '1') {
          renderTeacherDashboard(user);
        } else {
          renderAdminGate();
        }
      } else if (user?.role === 'student') {
        renderStudentDashboard(user);
      } else {
        renderLogin();
      }
    }

    function renderLogin() {
      app.innerHTML = `
        <section class="login-wrap" aria-labelledby="login-title">
          <div class="login-card">
            <p class="eyebrow">Entropy feedback</p>

    function getStudentSubmission(assignmentId, studentId) {
      return getSubmissions().find((submission) => submission.assignmentId === assignmentId && submission.studentId === studentId) || null;
    }

    function isPastDue(dueDate) {
      if (!dueDate) return false;
      const deadline = new Date(dueDate + 'T23:59:59.999');
      return !Number.isNaN(deadline.getTime()) && Date.now() > deadline.getTime();
    }

    function formatSubmittedAt(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return new Intl.DateTimeFormat('ko-KR', { dateStyle: 'medium', timeStyle: 'short' }).format(date);
    }

    function renderStudentDashboard(student) {
      const assignments = getAssignments();
      const selectedAssignment = assignments.find((assignment) => assignment.id === state.studentAssignmentId);
      if (selectedAssignment) {
        renderStudentAssignment(student, selectedAssignment);
        return;
      }
      state.studentAssignmentId = null;
      app.innerHTML = `
        <section aria-labelledby="student-dashboard-title">
          <div class="page-heading">
            <div>
              <p class="eyebrow">Student workspace</p>
              <h1 id="student-dashboard-title">내 과제</h1>
              <p>내 과제의 설명과 마감일을 확인하고, 내가 쓴 글을 제출하거나 수정할 수 있어요.</p>
            </div>
          </div>
          <div class="section-heading">
            <h2>과제 목록</h2>
            <span class="count-label">${assignments.length}개</span>
          </div>
          <div class="student-assignment-list">
            ${assignments.length ? assignments.map((assignment) => studentAssignmentCard(assignment, student.id)).join('') : emptyStudentAssignmentState()}
          </div>
        </section>`;
      document.querySelectorAll('[data-open-student-assignment]').forEach((button) => {
        button.addEventListener('click', () => {
          state.studentAssignmentId = button.dataset.openStudentAssignment;
          render();
        });
      });
    }

    function studentAssignmentCard(assignment, studentId) {
      const submission = getStudentSubmission(assignment.id, studentId);
      const closed = isPastDue(assignment.dueDate);
      const statusClass = submission?.feedbackAt ? 'feedback' : closed ? 'closed' : submission ? '' : 'pending';
      const statusText = submission?.feedbackAt ? '피드백 도착' : closed ? '마감됨' : submission ? '제출 완료' : '제출 전';
      const actionText = closed ? '내용 보기' : submission ? '다시 열기' : '과제 열기';
      return `
        <article class="student-assignment-card">
          <div>
            <h3>${escapeHtml(assignment.title)}</h3>
            <p class="assignment-description">${escapeHtml(assignment.description || '설명이 없습니다.')}</p>
            <div class="due-date"><span aria-hidden="true">◷</span><span>마감일 · ${escapeHtml(formatDueDate(assignment.dueDate))}</span></div>
          </div>
          <div class="student-assignment-actions">
            <span class="student-status ${statusClass}">${statusText}</span>
            <button type="button" class="button secondary" data-open-student-assignment="${escapeHtml(assignment.id)}">${actionText}</button>
          </div>
        </article>`;
    }

    function emptyStudentAssignmentState() {
      return '<div class="empty-state"><strong>아직 과제가 없습니다.</strong><span>선생님이 과제를 만들면 이곳에서 확인할 수 있어요.</span></div>';
    }

    function renderStudentAssignment(student, assignment) {
      const submission = getStudentSubmission(assignment.id, student.id);
      const closed = isPastDue(assignment.dueDate);
      const submissionBody = submission?.body || '';
      app.innerHTML = `
        <section class="student-detail" aria-labelledby="student-assignment-title">
          <button type="button" class="button secondary" id="student-back-button">← 과제 목록</button>
          <div class="panel" style="margin-top:18px">
            <div class="panel-header">
              <div>
                <p class="eyebrow">My assignment</p>
                <h1 id="student-assignment-title">${escapeHtml(assignment.title)}</h1>
                <p class="assignment-description">${escapeHtml(assignment.description || '설명이 없습니다.')}</p>
              </div>
            </div>
            <div class="student-detail-meta">
              <span class="meta-chip">마감일 <strong>${escapeHtml(formatDueDate(assignment.dueDate))}</strong></span>
              <span class="meta-chip">상태 <strong>${closed ? '마감됨' : submission ? '제출 완료' : '제출 전'}</strong></span>
            </div>
            <form id="student-submission-form" novalidate>
              <div class="field">
                <label for="student-response">내 글</label>
                <textarea id="student-response" ${closed ? 'disabled' : ''} placeholder="수업에서 이해한 내용을 내 말로 자유롭게 써 보세요.">${escapeHtml(submissionBody)}</textarea>
                <p class="help">${closed ? '마감일이 지나 새로 제출하거나 수정할 수 없습니다.' : submission ? '마감 전에는 이 글을 다시 수정할 수 있어요.' : '글자 수 제한 없이 자유롭게 작성할 수 있어요.'}</p>
              </div>
              <p id="student-message" class="form-message" role="alert"></p>
              <button type="submit" class="button" id="student-submit-button" ${closed ? 'disabled' : ''}>${submission ? '수정 저장' : '글 제출'}</button>
            </form>
            ${submission ? `
              <div class="submission-preview">
                <h3>내가 제출한 글</h3>
                <p class="submission-body">${escapeHtml(submissionBody || '작성한 내용 없이 제출됨')}</p>
                <p class="submission-time">${submission.updatedAt && submission.updatedAt !== submission.submittedAt ? '마지막 수정' : '제출'} · ${escapeHtml(formatSubmittedAt(submission.updatedAt || submission.submittedAt))}</p>
                ${submission.feedbackAt ? `
                  <div class="student-feedback">
                    <h3>선생님 피드백</h3>
                    <p>${escapeHtml(submission.feedback || '선생님이 피드백을 저장했습니다.')}</p>
                    <p class="submission-time">피드백 저장 · ${escapeHtml(formatSubmittedAt(submission.feedbackAt))}</p>
                  </div>` : `
                  <div class="student-feedback pending">
                    <h3>선생님 피드백</h3>
                    <p>아직 선생님 피드백이 없어요.</p>
                  </div>`}
              </div>` : ''}
          </div>
        </section>`;

      document.getElementById('student-back-button').addEventListener('click', () => {
        state.studentAssignmentId = null;
        render();
      });
      document.getElementById('student-submission-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        if (isPastDue(assignment.dueDate)) {
          document.getElementById('student-message').textContent = '마감일이 지나 제출하거나 수정할 수 없습니다.';
          return;
        }
        const body = document.getElementById('student-response').value.trim();
        const message = document.getElementById('student-message');
        const submitButton = document.getElementById('student-submit-button');
        submitButton.disabled = true;
        try {
          const existing = getStudentSubmission(assignment.id, student.id);
          const payload = existing
            ? { content: body, last_modified_at: new Date().toISOString() }
            : { assignment_id: assignment.id, student_id: student.id, content: body };
          const query = existing
            ? supabaseClient.from('submissions').update(payload).eq('id', existing.id)
            : supabaseClient.from('submissions').insert(payload);
          const { data: row, error } = await query.select('*').single();
          if (error) throw error;
          replaceCachedSubmission(submissionFromRow(row));
          render();
        } catch (error) {
          message.textContent = errorMessage(error, '글을 저장하지 못했습니다');
          submitButton.disabled = false;
        }
      });
    }

    function renderTeacherDashboard(teacher) {
      const assignments = getAssignments();
      const selectedAssignment = assignments.find((assignment) => assignment.id === state.teacherAssignmentId);
      if (selectedAssignment) {
        renderTeacherSubmissions(teacher, selectedAssignment);

      const panel = state.openPanel;
      app.innerHTML = `

      document.getElementById('reuse-button').addEventListener('click', () => {

    function renderTeacherSubmissions(teacher, assignment) {
      const submissions = getSubmissions()
        .filter((submission) => submission.assignmentId === assignment.id)
        .sort((a, b) => Number(Boolean(a.feedbackAt)) - Number(Boolean(b.feedbackAt)) || String(b.submittedAt || '').localeCompare(String(a.submittedAt || '')));
      app.innerHTML = `
        <section aria-labelledby="teacher-submissions-title">
          <button type="button" class="button secondary" id="teacher-back-button">← 과제 목록</button>
          <div class="page-heading" style="margin-top:22px">
            <div>
              <p class="eyebrow">Teacher feedback</p>
              <h1 id="teacher-submissions-title">${escapeHtml(assignment.title)}</h1>
              <p>${escapeHtml(assignment.description || '설명이 없습니다.')} · 제출 글 ${submissions.length}개</p>
            </div>
          </div>
          <div class="submission-list">
            ${submissions.length ? submissions.map(teacherSubmissionCard).join('') : emptySubmissionState()}
          </div>
        </section>`;

      document.getElementById('teacher-back-button').addEventListener('click', () => {
        state.teacherAssignmentId = null;
        render();
      });
      document.querySelectorAll('[data-save-feedback]').forEach((button) => {
        button.addEventListener('click', async () => {
          const submissionId = button.dataset.saveFeedback;
          const field = document.querySelector(`[data-feedback-field="${submissionId}"]`);
          const message = document.querySelector(`[data-feedback-message="${submissionId}"]`);
          const feedback = field.value.trim();
          if (!feedback) {
            message.textContent = '피드백 내용을 입력해 주세요.';
            return;
          }
          const submissions = getSubmissions();
          const index = submissions.findIndex((submission) => submission.id === submissionId);
          if (index === -1) return;
          button.disabled = true;
          try {
            const { data: row, error } = await supabaseClient
              .from('submissions')
              .update({ feedback, feedback_at: new Date().toISOString() })
              .eq('id', submissionId)
              .select('*')
              .single();
            if (error) throw error;
            replaceCachedSubmission(submissionFromRow(row));
            render();
          } catch (error) {
            message.textContent = errorMessage(error, '피드백을 저장하지 못했습니다');
            button.disabled = false;
          }
        });
      });
    }

    function teacherSubmissionCard(submission) {
      const completed = Boolean(submission.feedbackAt);
      const body = submission.body || (Array.isArray(submission.answers) ? submission.answers.map((answer) => answer.a).filter(Boolean).join('\n') : '');
      return `
        <article class="submission-card">
          <div class="submission-card-header">
            <div>
              <h3>${escapeHtml(submission.studentName || '이름 없는 학생')}</h3>

            </div>
            <span class="status-pill ${completed ? 'done' : ''}">${completed ? '피드백 완료' : '미피드백'}</span>
          </div>
          <div class="submission-content">${escapeHtml(body || '작성한 내용 없이 제출됨')}</div>
          ${completed ? `
            <div class="feedback-saved">
              <strong>저장된 피드백</strong>
              <p>${escapeHtml(submission.feedback || '피드백 내용 없음')}</p>
              <div class="submission-time">저장 시간 · ${escapeHtml(formatSubmittedAt(submission.feedbackAt))}</div>
            </div>` : `
            <label for="feedback-${escapeHtml(submission.id)}">피드백</label>
            <textarea id="feedback-${escapeHtml(submission.id)}" data-feedback-field="${escapeHtml(submission.id)}" placeholder="학생의 글을 읽고 피드백을 남겨 주세요."></textarea>
            <p class="form-message" data-feedback-message="${escapeHtml(submission.id)}" role="alert"></p>
            <button type="button" class="button" data-save-feedback="${escapeHtml(submission.id)}">피드백 저장</button>`}
        </article>`;
    }

    function emptySubmissionState() {
      return '<div class="empty-state"><strong>아직 제출된 글이 없습니다.</strong><span>학생이 글을 제출하면 이곳에서 확인할 수 있어요.</span></div>';

            </div>
          </form>
        </section>`;
    }

    function reuseAssignmentPanel(assignments) {
      return `
        <section class="panel" aria-labelledby="reuse-assignment-title">
          <div class="panel-header">
            <div>
              <h2 id="reuse-assignment-title">이전 과제 다시 사용</h2>
              <p>제목과 설명을 가져와 새 과제로 등록합니다. 제출 글과 피드백은 복사하지 않습니다.</p>
            </div>
            <button type="button" class="button secondary" data-close-panel>닫기</button>
          </div>
          ${assignments.length ? `
            <form id="reuse-assignment-form" novalidate>
              <div class="form-grid">
                <div class="field">
                  <label for="source-assignment">다시 사용할 과제</label>
                  <select id="source-assignment" required>
                    <option value="">과제를 선택하세요</option>
                    ${assignments.map((assignment) => `<option value="${escapeHtml(assignment.id)}">${escapeHtml(assignment.title)}</option>`).join('')}
                  </select>
                </div>
                <div class="field">
                  <label for="reuse-due-date">새 마감일</label>
                  <input id="reuse-due-date" type="date" min="${todayValue()}" required>
                </div>
              </div>
              <p id="reuse-preview" class="help">과제를 선택하면 가져올 제목과 설명이 여기에 표시됩니다.</p>
              <p id="reuse-message" class="form-message" role="alert"></p>
              <div class="form-actions">
                <button type="submit" class="button">새 과제로 저장</button>
                <button type="button" class="button secondary" data-close-panel>취소</button>
              </div>
            </form>` : emptyReuseState()}
        </section>`;
    }

    function emptyReuseState() {
      return '<div class="empty-state"><strong>다시 사용할 과제가 없습니다.</strong><span>먼저 새 과제를 하나 만들어 주세요.</span></div>';
    }

    function emptyAssignmentState() {
      return '<div class="empty-state"><strong>아직 만든 과제가 없습니다.</strong><span>첫 과제를 만들면 이곳에서 제출 현황을 확인할 수 있어요.</span></div>';
    }

    function assignmentCard(assignment) {
      const stats = assignmentStats(assignment.id);
      return `
        <article class="assignment-card" data-assignment-id="${escapeHtml(assignment.id)}">
          <h3>${escapeHtml(assignment.title)}</h3>
          <p class="assignment-description">${escapeHtml(assignment.description || '설명이 없습니다.')}</p>
          <div class="assignment-meta" aria-label="${escapeHtml(assignment.title)} 현황">
            <span class="meta-chip">제출 인원 <strong>${stats.submitted}명</strong></span>
            <span class="meta-chip">미피드백 <strong>${stats.waiting}개</strong></span>
          </div>
          <div class="due-date"><span aria-hidden="true">◷</span><span>마감일 · ${escapeHtml(formatDueDate(assignment.dueDate))}</span></div>
          <div class="assignment-card-actions">
            <button type="button" class="button secondary" data-open-teacher-assignment="${escapeHtml(assignment.id)}" ${stats.submitted ? '' : 'disabled'}>제출 글 보기</button>
          </div>
        </article>`;
    }

    function bindCloseButtons() {
      document.querySelectorAll('[data-close-panel]').forEach((button) => {
        button.addEventListener('click', () => {
          state.openPanel = null;
          render();
        });
      });
    }

    function bindNewAssignmentForm() {
      bindCloseButtons();
      document.getElementById('new-assignment-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const title = document.getElementById('new-title').value.trim();
        const description = document.getElementById('new-description').value.trim();
        const dueDate = document.getElementById('new-due-date').value;
        const message = document.getElementById('new-message');
        if (!title || !description || !dueDate) {
          message.textContent = '제목, 설명, 마감일을 모두 입력해 주세요.';
          return;
        }
        const submitButton = event.currentTarget.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        try {
          await saveAssignment(title, description, dueDate, null);
          state.openPanel = null;
          render();
        } catch (error) {
          message.textContent = errorMessage(error, '과제를 저장하지 못했습니다');
          submitButton.disabled = false;
        }
      });
    }

    function bindReuseAssignmentForm() {
      bindCloseButtons();
      const select = document.getElementById('source-assignment');
      const preview = document.getElementById('reuse-preview');
      select.addEventListener('change', () => {
        const source = getAssignments().find((assignment) => assignment.id === select.value);
        preview.textContent = source ? `가져올 제목: ${source.title} · 설명: ${source.description}` : '과제를 선택하면 가져올 제목과 설명이 여기에 표시됩니다.';
      });
      document.getElementById('reuse-assignment-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const sourceId = select.value;
        const dueDate = document.getElementById('reuse-due-date').value;
        const message = document.getElementById('reuse-message');
        if (!sourceId || !dueDate) {
          message.textContent = '이전 과제와 새 마감일을 선택해 주세요.';
          return;
        }
        const submitButton = event.currentTarget.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        try {
          await saveAssignment('', '', dueDate, sourceId);
          state.openPanel = null;
          render();
        } catch (error) {
          message.textContent = errorMessage(error, '과제를 저장하지 못했습니다');
          submitButton.disabled = false;
        }
      });
    }

    async function initialize() {
      renderLoading();
      try {
        await loadData();
        await ensureAccounts();
        render();
      } catch (error) {
        renderLoadError(error);
      }
    }

    initialize();
  </script>
</body>
</html>
